# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Siegel's theorem on L(1, χ) for real Dirichlet characters"
  description: >-
    A Lean 4 / Mathlib proof of Siegel's theorem (1935): for every ε > 0 there is c > 0 with
    c·N^(-ε) ≤ ‖L(1, χ)‖ for every real non-principal Dirichlet character χ modulo N
    (SiegelThm.siegel, with Mathlib's DirichletCharacter.LFunction; χ need not be primitive).
    The proof is Goldfeld's (1974): F = ζ·L(χ₁)L(χ₂)L(χ₁χ₂) has non-negative Dirichlet
    coefficients with a₁ = 1; its regular part G = F − λ/(s−1) is expanded in a Taylor series at
    s = 2, with Cauchy's estimate on the circle |s−2| = 3/2 (where |G| ≤ 4000 (N₁N₂)²), giving
    ‖λ‖ ≥ (1−β)/2 · (50000 (N₁N₂)²)^(−4(1−β)) whenever Re F(β) ≤ 0 and 7/8 ≤ β < 1; Siegel's
    dichotomy (an exceptional zero in [1−ε/16, 1) or none, in which case χ₁ is the character
    mod 4) gives the ineffective constant. Characters that induce the same character as χ₁ are
    handled with the Euler factors (∏_{p∣n}(1−1/p) ≥ c(η)n^(−η)). Two auxiliary statements
    are also compared: the integral representation L(s, χ) = s∫_1^∞ A(t) t^(−s−1) dt on
    Re s > 0 (SiegelThm.LFunction_eq_integral, via Mathlib's Abel summation for Re s > 1, a
    Mellin-transform holomorphy argument and the identity theorem) and ‖∑_{k≤M} χ(k)‖ ≤ N
    (SiegelThm.norm_sum_Icc_le). Mathlib is the only dependency; Mathlib's continuation of ζ
    is not used (ζ(s) = 1/(s−1) + 1 − s∫_1^∞{t}t^(−s−1) dt is proved directly). Three
    statements; no definitions beyond Mathlib's.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

