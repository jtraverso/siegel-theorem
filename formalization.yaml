    authors:
      - "Carl Ludwig Siegel"
    type: "paper"
    location: "Acta Arithmetica 1 (1935), 83–86"
    relationship: "formalizes"
    note: >-
      The theorem L(1, χ) ≫_ε N^(−ε) for real characters. The formalized proof is not Siegel's
      original one but Goldfeld's. The formalization is by a different author.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "A simple proof of Siegel's theorem"
    authors:
      - "Dorian Goldfeld"
    id: "doi:10.1073/pnas.71.4.1055"
    type: "paper"
    location: "Proc. Nat. Acad. Sci. USA 71 (1974), 1055"
    relationship: "formalizes"
    note: >-
      The proof formalized (auxiliary function ζL(χ₁)L(χ₂)L(χ₁χ₂), Taylor expansion at 2).
      Constants were made explicit for the formalization. The article's author was not
      involved.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Multiplicative Number Theory I. Classical Theory"
    authors:
      - "Hugh L. Montgomery"
      - "Robert C. Vaughan"
    type: "book"
