related_formalizations:
  - id: "PALOMAR-2026-10-21-000005 (sthubbar/goldbach-lean, entries/heathbrown1985)"
    relationship: "related"
    note: >-
      Contains another formalization of Siegel's theorem and of the integral representation
      with the same statements. This entry is an independent development (its proof sources
      were not consulted and no code is shared); it exists so that packages can depend on
      Siegel's theorem without a sub-directory lake dependency.

status:
  scope: "Siegel's theorem for real non-principal characters of every modulus; the integral representation of L(s, χ) on Re s > 0; the bound for character sums. Not formalized: effective versions, Siegel–Walfisz."
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Wrote the proof plan (NOTES.md), the Lean development (SiegelThm/*.lean), the
        Challenge/Solution pair and the packaging under the author's direction, checked with
        lean, #print axioms and a comparison of the elaborated Challenge and Solution
        statements (pp.all) (Lean v4.35.0-rc3, Mathlib c55e6e786f49471c72fbddbec5415808896aec1e).
      cost:
        wall_time: "a few hours"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "Natural-language instructions in Spanish, directed by the author."
  spend_usd: "subscription-based"
  notes: >-
    The result was chosen by the human author; the Lean development is AI-written under the
    author's direction and mechanically verified: no sorry, axioms limited to propext,
    Classical.choice and Quot.sound, identical elaborated statements in the Challenge and the
    Solution.

fidelity:
  divergences: >-
    "Real character" is χ ^ 2 = 1 and "non-principal" is χ ≠ 1 in Mathlib's
    DirichletCharacter ℂ N; L(1, χ) is Mathlib's DirichletCharacter.LFunction χ 1 (the analytic
    continuation, equal to the convergent series). The constant c depends on ε only and is
    ineffective, as in Siegel's theorem.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, distinct from the mechanical verification: the agent
    checked the statements against the classical theorem (the exponent −ε, the dependence of
    c on ε only, all moduli including non-primitive characters; for N = 1 there is no
    non-principal character). No independent human review has been performed. The result is
    classical; no mathematical novelty is claimed.

alignment:
  namespace: "SiegelThm"
  statements:
    - {source: "Siegel 1935: L(1, χ) ≫_ε N^(−ε)", lean: "SiegelThm.siegel", module: "SiegelThmChallenge", status: "proved"}
    - {source: "L(s, χ) = s ∫_1^∞ A(t) t^(−s−1) dt, Re s > 0", lean: "SiegelThm.LFunction_eq_integral", module: "SiegelThmChallenge", status: "proved"}
    - {source: "|∑_{k ≤ M} χ(k)| ≤ N", lean: "SiegelThm.norm_sum_Icc_le", module: "SiegelThmChallenge", status: "proved"}

acknowledgements: >-
  Mathlib and the Lean community.
